<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Negative bolt, violet — the same shape, asking whether the blue should stay</title>
  <defs>
    <linearGradient id="v-body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#A78BFF"/>
      <stop offset="0.5" stop-color="#6D4AF0"/>
      <stop offset="1" stop-color="#3A1FA8"/>
    </linearGradient>
    <linearGradient id="v-sheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="v-cut">
      <rect width="256" height="256" fill="#FFFFFF"/>
      <path d="M148 44 L74 148 L120 148 L104 212 L184 104 L136 104 Z"
            fill="#000000" stroke="#000000" stroke-width="10" stroke-linejoin="round"/>
    </mask>
  </defs>

  <rect x="12" y="12" width="232" height="232" rx="60" fill="url(#v-body)" mask="url(#v-cut)"/>
  <rect x="12" y="12" width="232" height="232" rx="60" fill="url(#v-sheen)" mask="url(#v-cut)"/>
</svg>
