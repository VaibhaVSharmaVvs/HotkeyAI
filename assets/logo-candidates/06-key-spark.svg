<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Key and spark — the hotkey, and the AI that wrote what it does</title>
  <defs>
    <linearGradient id="k-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#2B2FB8"/>
    </linearGradient>
    <linearGradient id="k-cap" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFDCFF"/>
    </linearGradient>
    <filter id="k-lift" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#0B1240" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#k-bg)"/>

  <!-- The key, offset down-left to leave the corner for the spark -->
  <g filter="url(#k-lift)">
    <rect x="40" y="76" width="140" height="130" rx="34" fill="url(#k-cap)"/>
  </g>
  <path d="M124 98 L84 148 L110 148 L100 182 L140 130 L114 130 Z"
        fill="#2B2FB8" stroke="#2B2FB8" stroke-width="7" stroke-linejoin="round"/>

  <!-- The four-point spark: what every AI product on the planet now uses, and the half of
       the name the bolt alone never says. -->
  <path d="M192 44 C192 74 196 78 226 78 C196 78 192 82 192 112
           C192 82 188 78 158 78 C188 78 192 74 192 44 Z" fill="#FFFFFF"/>
  <path d="M226 116 C226 132 228 134 244 134 C228 134 226 136 226 152
           C226 136 224 134 208 134 C224 134 226 132 226 116 Z" fill="#FFFFFF" opacity="0.85"/>
</svg>
