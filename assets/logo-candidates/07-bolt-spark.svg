<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Bolt and spark — flat and bold, with the AI half stated</title>
  <defs>
    <linearGradient id="s-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.55" stop-color="#4A6BF5"/>
      <stop offset="1" stop-color="#22C9E0"/>
    </linearGradient>
    <mask id="s-cut">
      <rect width="256" height="256" fill="#FFFFFF"/>
      <path d="M150 40 L78 146 L124 146 L108 216 L186 104 L138 104 Z"
            fill="#000000" stroke="#000000" stroke-width="11" stroke-linejoin="round"/>
      <path d="M206 42 C206 68 209 71 235 71 C209 71 206 74 206 100
               C206 74 203 71 177 71 C203 71 206 68 206 42 Z" fill="#000000"/>
    </mask>
  </defs>

  <!-- The tri-stop gradient is the whole idea: violet to cyan is what current AI products
       look like, and it costs nothing at small sizes because the shapes carry the mark. -->
  <rect x="12" y="12" width="232" height="232" rx="60" fill="url(#s-bg)" mask="url(#s-cut)"/>
</svg>
