<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Keycap, elevated — the whole icon is one key, lit from above</title>
  <defs>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D6FE8"/>
      <stop offset="1" stop-color="#1E3A8F"/>
    </linearGradient>
    <linearGradient id="face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8FC0FF"/>
      <stop offset="0.55" stop-color="#5A9CF8"/>
      <stop offset="1" stop-color="#3B78E0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0B1428" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Skirt: the key's body, seen slightly from above -->
  <rect x="18" y="22" width="220" height="212" rx="46" fill="url(#skirt)" filter="url(#lift)"/>

  <!-- Face: inset further at the bottom than the top. That asymmetry is what reads as "key" -->
  <rect x="36" y="38" width="184" height="166" rx="34" fill="url(#face)"/>
  <rect x="36" y="38" width="184" height="80" rx="34" fill="url(#gloss)"/>

  <!-- The bolt: what the keypress does -->
  <path d="M143 62 L86 140 L124 140 L109 196 L172 116 L134 116 Z"
        fill="#0E1730" stroke="#0E1730" stroke-width="9" stroke-linejoin="round"/>
</svg>
