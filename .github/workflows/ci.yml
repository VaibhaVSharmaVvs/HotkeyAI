name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  schema-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install jsonschema

      # Schema hygiene: valid draft 2020-12, resolvable refs, NO $ref cycles, no keywords
      # outside the structured-output subset, description coverage. The cycle check is the
      # V2 precondition — structured outputs reject recursive schemas.
      - name: schema hygiene
        run: python tools/schema-checks/check_schema.py schema/hotkeyai-dsl-v1.schema.json

      # Every example validates, 14 negative cases are rejected, and every action type is
      # exercised by at least one example.
      - name: examples and negative cases
        run: python tools/schema-checks/validate_examples.py .

      # docs/capabilities.md is generated. Fails if it has drifted from the schema.
      - name: capabilities doc is current
        run: python tools/schema-checks/gen_capabilities.py . --check

  build-and-test:
    # Core targets plain net10.0 with no Windows dependencies, so it must build and test on
    # Linux. If this job ever needs windows-latest, something Win32 has leaked out of Agent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      # Warnings are errors (Directory.Build.props) — a validator that compiles with
      # warnings is a validator with holes in it.
      - run: dotnet build --no-restore --configuration Release

      # Includes the bidirectional schema/record conformance test and the round-trip tests
      # over every reference automation.
      - run: dotnet test --no-build --configuration Release --verbosity normal
